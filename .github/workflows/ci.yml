name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-linux:
    name: Test (ubuntu, real downloaders)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install real downloaders & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qbittorrent-nox transmission-daemon xz-utils
          qbittorrent-nox --version || true
          transmission-daemon --version || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - name: Prepare GeoIP ASN database (for geoip suite)
        run: |
          mkdir -p target/geoip-data/ipdb
          curl -sSL --retry 3 --retry-delay 5 -o /tmp/asn.xz \
            https://github.com/PBH-BTN/GeoLite.mmdb/releases/latest/download/GeoLite2-ASN.mmdb.xz
          xz -dc /tmp/asn.xz > target/geoip-data/ipdb/GeoLite2-ASN.mmdb
          ls -la target/geoip-data/ipdb/

      - name: Prepare upstream WebUI dist (for static-serving checks)
        run: |
          curl -sSL --retry 3 --retry-delay 5 -o /tmp/pbh.zip \
            https://github.com/PBH-BTN/PeerBanHelper/releases/download/v9.5.1/PeerBanHelper_9.5.1.zip
          python3 - <<'PY'
          import zipfile, io, os
          outer = zipfile.ZipFile('/tmp/pbh.zip')
          jar = zipfile.ZipFile(io.BytesIO(outer.read('PeerBanHelper/PeerBanHelper.jar')))
          out = 'webui-dist'
          os.makedirs(out, exist_ok=True)
          n_files = 0
          for n in jar.namelist():
              if n.startswith('static/') and not n.endswith('/'):
                  rel = n[len('static/'):]
                  p = os.path.join(out, rel)
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  open(p, 'wb').write(jar.read(n))
                  n_files += 1
          print('webui-dist ready:', n_files, 'files')
          PY

      - name: Integration suites (fake downloaders)
        run: |
          set -e
          for t in smoke api_test modules_test pcb_test rule_sub_test geoip_test adapters_test batch_a_test; do
            echo "===== suite: $t ====="
            python3 tests/$t.py
          done

      - name: Integration suites (real qbittorrent-nox / transmission-daemon)
        run: |
          set -e
          echo "===== suite: real_qb_test ====="
          python3 tests/real_qb_test.py
          echo "===== suite: real_tr_test ====="
          python3 tests/real_tr_test.py

      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-logs
          python3 - <<'PY'
          import glob, os, shutil, tempfile
          for f in glob.glob(os.path.join(tempfile.gettempdir(), 'pbh-*.log')):
              shutil.copy(f, 'ci-logs')
          shutil.copy('/tmp/tr-test.log', 'ci-logs') if os.path.exists('/tmp/tr-test.log') else None
          print('collected:', os.listdir('ci-logs'))
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs-linux
          path: ci-logs/
          if-no-files-found: ignore

  test-windows:
    name: Test (windows, fake downloaders)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      - name: Prepare GeoIP ASN database (for geoip suite)
        shell: bash
        run: |
          python - <<'PY'
          import lzma, os, urllib.request
          os.makedirs('target/geoip-data/ipdb', exist_ok=True)
          url = 'https://github.com/PBH-BTN/GeoLite.mmdb/releases/latest/download/GeoLite2-ASN.mmdb.xz'
          data = urllib.request.urlopen(url, timeout=180).read()
          out = 'target/geoip-data/ipdb/GeoLite2-ASN.mmdb'
          open(out, 'wb').write(lzma.decompress(data))
          print('mmdb ready', os.path.getsize(out))
          PY

      - name: Prepare upstream WebUI dist (for static-serving checks)
        shell: bash
        run: |
          python - <<'PY'
          import io, os, urllib.request, zipfile
          url = 'https://github.com/PBH-BTN/PeerBanHelper/releases/download/v9.5.1/PeerBanHelper_9.5.1.zip'
          outer = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url, timeout=300).read()))
          jar = zipfile.ZipFile(io.BytesIO(outer.read('PeerBanHelper/PeerBanHelper.jar')))
          out = 'webui-dist'
          os.makedirs(out, exist_ok=True)
          n_files = 0
          for n in jar.namelist():
              if n.startswith('static/') and not n.endswith('/'):
                  p = os.path.join(out, n[len('static/'):])
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  open(p, 'wb').write(jar.read(n))
                  n_files += 1
          print('webui-dist ready:', n_files, 'files')
          PY

      - name: Integration suites (fake downloaders)
        shell: bash
        env:
          PBH_BIN: ${{ github.workspace }}/target/debug/pbh.exe
        run: |
          set -e
          for t in smoke api_test modules_test pcb_test rule_sub_test geoip_test adapters_test batch_a_test; do
            echo "===== suite: $t ====="
            python tests/$t.py
          done

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          python - <<'PY'
          import glob, os, shutil, tempfile
          for f in glob.glob(os.path.join(tempfile.gettempdir(), 'pbh-*.log')):
              shutil.copy(f, 'ci-logs')
          print('collected:', os.listdir('ci-logs'))
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-logs-windows
          path: ci-logs/
          if-no-files-found: ignore
